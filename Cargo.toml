[package]
name = "klint"
version = "0.1.0"
edition = "2021"
authors = ["KQL Linter Contributors"]
license = "MIT"
description = "A linter for KQL (Kusto Query Language) files to enforce table naming conventions"
repository = "https://github.com/yourusername/klint"
keywords = ["kql", "kusto", "linter", "azure", "data-explorer"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "klint"
path = "src/lib.rs"

[[bin]]
name = "klint"
path = "src/main.rs"

[[bin]]
name = "klint-lsp"
path = "src/bin/klint-lsp.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
colored = "2.1"
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"
walkdir = "2.5"
regex = "1.11"
lazy_static = "1.5"
convert_case = "0.6"

# LSP dependencies
tower-lsp = "0.20"
tokio = { version = "1.0", features = ["full"] }
tree-sitter = "0.20"
tree-sitter-kusto = { path = "/Users/russellboley/zed-extensions/kql-highlighter/tree-sitter-kusto" }
lsp-types = "0.94"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
criterion = "0.5"
